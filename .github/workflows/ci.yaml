name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build

      # Зберігаємо збірку після push у main
      - name: Save artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/
