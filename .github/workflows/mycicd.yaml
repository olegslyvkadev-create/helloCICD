
name: React CI/CD

# Коли запускати workflow
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ===== CI =====
  ci:
    runs-on: ubuntu-latest

    steps:
      # Завантажити код
      - uses: actions/checkout@v6

      # Встановити Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Встановити залежності
      - run: npm ci

      # Перевірити код
      - run: npm run lint
      - run: npm run test --if-present

      # Зібрати React
      - run: npm run build

      # Зберегти результат збірки
      - name: Upload build
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  # ===== CD =====
  cd:
    needs: ci

    # Деплой тільки після push у main
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Підготувати GitHub Pages
      - uses: actions/configure-pages@v5

      # Опублікувати готовий build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
